name: Watcher2
on:
  workflow_run:
    workflows: ["Release Workflow"]
    types: [completed]
permissions:
  contents: read
jobs:
  w:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.registry_package.package_version.container_metadata.tag.name == 'development' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'development')
    runs-on: ubuntu-latest
    steps:
      - run: echo "EXACT DEPLOY GATE PASSED on ${{ github.event_name }} / ${{ github.event.workflow_run.event }} / ${{ github.event.workflow_run.head_branch }}"
