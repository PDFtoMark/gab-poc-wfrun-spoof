name: runid-upstream
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - run: echo '<testsuite name="s"><testcase name="t"/></testsuite>' > r.xml
      - uses: actions/upload-artifact@v4
        with:
          name: test-results-x
          path: r.xml
